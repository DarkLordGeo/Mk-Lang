name: Bug report
description: The compiler, the standard library or a tool does something wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report a security problem privately instead: see [SECURITY.md](https://github.com/zerodayokay/Mk-Lang/blob/main/SECURITY.md).
  - type: textarea
    id: version
    attributes:
      label: Mk version
      description: The full output of `mk version`.
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows x86_64
        - Linux x86_64
        - Linux x86_64 under WSL 2
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: Windows 11 24H2, Ubuntu 24.04
  - type: textarea
    id: program
    attributes:
      label: A minimal program
      description: The smallest program that shows the problem, with its `pkg.mk` if it has one.
      render: text
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The command you ran.
      placeholder: mk run main.mk
      render: sh
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: The output, the diagnostic or the panic report, as text.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
