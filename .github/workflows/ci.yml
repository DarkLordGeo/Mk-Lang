# Why: every change to main must build and pass its tests on both supported
# hosts before anyone builds on top of it.
#
# What: build, vet, gofmt, the Go tests (std's long suite runs nightly) and
# the documentation tests, on the Windows and Linux self-hosted runners.
#
# How: runs on pushes to main, on pull requests from branches of this
# repository, and by hand. The job skips pull requests from forks, but a
# fork can change this file, so the guard is the repository's approval
# setting: a fork's run waits for a maintainer, and approving it runs the
# fork's workflow files on the self-hosted runners, which run on a
# maintainer's machine. Never approve one; see .github/runners/README.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            gate: "1"
            shards: "3"
            otherp: "2"
            alone: ""
            last: "mk/internal/corpus mk/internal/lsp"
            alonemem: ""
            shardmem: "4GiB"
            lastmem: "8GiB"
            shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -e -o pipefail {0}
          - os: linux
            gate: ""
            shards: "3"
            otherp: "2"
            alone: "TestScheduleIsDeterministic|TestConcurrentBuildsShareCache|TestBodiesInParallelAreDeterministic"
            last: "mk/internal/corpus mk/internal/lsp"
            alonemem: "5GiB"
            shardmem: "3GiB"
            lastmem: "5GiB"
            shell: bash
    runs-on: [self-hosted, "${{ matrix.os }}", x64, mk]
    timeout-minutes: 360
    defaults:
      run:
        # Git Bash by its short path: a plain `bash` on a Windows runner can
        # resolve to C:\Windows\System32\bash.exe, WSL's launcher, which cannot
        # run the step's script, and CI must never start wsl.exe here.
        shell: ${{ matrix.shell }}
    env:
      # MK_GATE=1 turns a test that cannot run here into a failure; only the
      # Windows job sets it, since on Linux the Windows legs cannot run.
      MK_GATE: ${{ matrix.gate }}
      MK_CACHE: ${{ github.workspace }}/../.mkcache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A temporary directory of the job's own, which the runner empties after
      # each job: files another program left in the user's temp directory (a
      # stray pkg.mk there once made every test fixture one package) never
      # reach the tests.
      - name: Temporary directory
        run: |
          mkdir -p "$RUNNER_TEMP/tmp"
          tmp="$RUNNER_TEMP/tmp"
          # Git Bash on Windows: a native path, not one with mixed separators.
          if command -v cygpath >/dev/null; then tmp=$(cygpath -w "$tmp"); fi
          echo "TMP=$tmp" >> "$GITHUB_ENV"
          echo "TEMP=$tmp" >> "$GITHUB_ENV"
          echo "TMPDIR=$tmp" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          go version
          go run ./cmd/mk version

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Format
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt would change:"
            echo "$out"
            exit 1
          fi

      - name: Test
        # tools/ci/test.sh splits internal/driver, most of the run, across
        # processes and keeps the memory-heavy tests apart; the matrix sets
        # its shards and Go heap caps for each runner's memory.
        run: bash tools/ci/test.sh
        env:
          DRIVER_SHARDS: ${{ matrix.shards }}
          OTHER_P: ${{ matrix.otherp }}
          ALONE_TESTS: ${{ matrix.alone }}
          LAST_PKGS: ${{ matrix.last }}
          ALONE_MEM: ${{ matrix.alonemem }}
          SHARD_MEM: ${{ matrix.shardmem }}
          LAST_MEM: ${{ matrix.lastmem }}

      - name: Documentation tests
        run: go run ./cmd/mk corpus
